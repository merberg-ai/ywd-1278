name: p5-live-ci

on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev-0c-p5-live-txdelay-ywdnod]

jobs:
  p5-live-txdelay-ywdnod:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Compile final P5 live harness and contract
        run: |
          python -m py_compile tools/qualify_live_p5_txdelay_ywdnod.py
          python -m py_compile tools/qualify_live_p5_txdelay_ywdnod_r2.py
          python -m py_compile tools/qualify_live_p5_txdelay_ywdnod_r3.py
          python -m py_compile tests/live_p5_txdelay_ywdnod_contract_test.py

      - name: Final R3 guarded harness dry run
        run: python tools/qualify_live_p5_txdelay_ywdnod_r3.py

      - name: P5 live YWDNOD safety contract
        run: python tests/live_p5_txdelay_ywdnod_contract_test.py

      - name: Parse P5 live R3 staging manifest
        run: |
          python - <<'PY'
          import json
          data = json.load(open('firmware/qualification/0c-p5-live-txdelay-ywdnod.json', encoding='utf-8'))
          assert data['phase'] == '0C-P5-live'
          assert data['attempt'] == 'R3'
          assert data['status'] == 'staged'
          assert data['authorized_harness'] == 'tools/qualify_live_p5_txdelay_ywdnod_r3.py'
          assert data['base_checkpoint_sha'] == '30cc677fbcc9fc9bab1aa1a18c18850ed1ef40a1'
          assert data['frequency_hz'] == 145050000
          assert data['rf_power'] == 200
          assert data['digipeater_station'] == 'KJ6YWD-5'
          assert data['digipeater_alias'] == 'YWDNOD'
          assert data['path'] == ['YWDNOD']
          assert data['cycles'] == 2
          assert [x['txdelay_units'] for x in data['frames']] == [30, 50]
          assert [x['pre_flags'] for x in data['frames']] == [45, 75]
          assert [x['expected_generated_samples'] for x in data['frames']] == [13072, 16912]
          assert data['qualification_frames_may_authorize_later_tx'] is False
          assert data['final_rx_proof_may_be_qualification_frame'] is False
          assert data['required_external_direct_decodes'] == 2
          assert data['required_external_ywdnod_repeat_decodes'] == 2
          assert data['expected_repeated_path_marker'] == 'YWDNOD*'
          assert data['maximum_transmit_submissions'] == 2
          assert data['automatic_tx_retry'] is False
          assert data['kiss_parameter_ingress_connected'] is False
          assert data['kiss_data_tx_connected'] is False
          assert data['product_tx_enabled'] is False
          assert data['flash_permitted'] is False
          assert data['gpio_reset_permitted'] is False
          assert data['option_bytes_permitted'] is False
          print('P5_LIVE_R3_MANIFEST_PARSE=PASS')
          PY

      - name: Parse P5 live partial physical evidence
        run: |
          python - <<'PY'
          import json
          data = json.load(open('firmware/qualification/0c-p5-live-txdelay-ywdnod-physical-evidence.json', encoding='utf-8'))
          assert data['phase'] == '0C-P5-live'
          assert data['status'] == 'physical-execution-pass-ywdnod-repeat-pending'
          assert data['staged_checkpoint_sha'] == '634e796cbc862ed0541351ffc2aa66b780731f7c'
          assert data['host_checkpoint_sha'] == '30cc677fbcc9fc9bab1aa1a18c18850ed1ef40a1'
          assert data['live_harness_result'] == 'YWD1278_0C_P5_R2_LIVE_TXDELAY_YWDNOD_EXECUTION=PASS'
          assert data['authorized_entry_point'] == 'tools/qualify_live_p5_txdelay_ywdnod_r3.py'
          assert data['tx_submissions'] == 2
          assert data['complete_rx_tx_rx_cycles'] == 2
          assert data['post_tx_rx_restarts'] == 2
          assert data['qualifying_non_p5_inbound_frames'] == 3
          assert data['p5_qualification_echoes_ignored'] == 2
          assert data['final_post_tx_non_qualification_fcs_valid_rx'] is True
          assert data['fifo_dropped_bytes'] == 0
          assert [x['txdelay_units'] for x in data['cycles']] == [30, 50]
          assert [x['opening_flags'] for x in data['cycles']] == [45, 75]
          assert [x['observed_generated_samples'] for x in data['cycles']] == [13072, 16912]
          ext = data['external_receiver']
          assert ext['direct_decode_required'] == 2
          assert ext['direct_decode_observed'] == 2
          assert ext['direct_decode_gate_satisfied'] is True
          assert ext['ywdnod_repeat_required'] == 2
          assert ext['ywdnod_repeat_observed'] == 0
          assert ext['ywdnod_repeat_gate_satisfied'] is False
          assert data['direct_txdelay_physical_gate_satisfied'] is True
          assert data['ywdnod_repeat_gate_satisfied'] is False
          assert data['full_physical_qualification_complete'] is False
          assert data['rerun_completed_two_burst_harness_permitted'] is False
          assert data['duplicate_dispatch'] is False
          assert data['automatic_tx_retry'] is False
          assert data['flash_written'] is False
          assert data['gpio_accessed'] is False
          assert data['option_bytes_written'] is False
          print('P5_LIVE_PARTIAL_PHYSICAL_EVIDENCE_PARSE=PASS')
          print('DIRECT_EXTERNAL_DECODE_GATE=PASS_2_OF_2')
          print('YWDNOD_REPEAT_GATE=PENDING_0_OF_2_PROVEN')
          print('FULL_P5_LIVE_QUALIFICATION=NO')
          print('RERUN_COMPLETED_TWO_BURST_HARNESS=FORBIDDEN')
          PY

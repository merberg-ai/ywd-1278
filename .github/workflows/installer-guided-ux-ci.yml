name: installer-guided-ux-ci

on:
  push:
    branches: [dev-installer-guided-ux]
  workflow_dispatch:

jobs:
  installer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Exact checked-out tip
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Installer shell syntax
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            bash -n "$file"
          done < <(find installer -type f -name '*.sh' -print0)
      - name: Installer prompt contract
        run: python tests/installer_piped_prompt_contract_test.py
      - name: Installer user-output contract
        run: python tests/installer_user_output_contract_test.py

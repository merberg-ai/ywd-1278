name: 0e-p3-auth-lan-console-ci

on:
  push:
    branches: [dev-0e-p3-auth-lan-console]
  pull_request:
    branches: [dev]
    paths:
      - 'src/ywd1278/console/auth.py'
      - 'src/ywd1278/console/lan_telnet.py'
      - 'tests/auth_lan_console*_test.py'
      - 'tools/qualify_0e_p3_lan.py'
      - 'tools/cleanup_0e_p3_lan.py'
      - '.github/workflows/0e-p3-auth-lan-console-ci.yml'
      - 'firmware/qualification/0e-p3-*'
      - 'docs/qualifications/0e-p3-*'
      - 'docs/ROADMAP.md'

jobs:
  authenticated-lan-console-host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Compile 0E-P3 boundary
        run: |
          python -m py_compile src/ywd1278/console/auth.py
          python -m py_compile src/ywd1278/console/lan_telnet.py
          python -m py_compile tests/auth_lan_console_test.py
          python -m py_compile tests/auth_lan_console_contract_test.py
          python -m py_compile tests/auth_lan_console_qualification_contract_test.py
          python -m py_compile tests/auth_lan_console_target_pi_evidence_contract_test.py
          python -m py_compile tools/qualify_0e_p3_lan.py
          python -m py_compile tools/cleanup_0e_p3_lan.py

      - name: Authenticated LAN console regression
        run: PYTHONPATH=src python tests/auth_lan_console_test.py

      - name: Authenticated LAN console architecture and safety contract
        run: PYTHONPATH=src python tests/auth_lan_console_contract_test.py

      - name: Frozen 0E-P3 host qualification evidence
        run: PYTHONPATH=src python tests/auth_lan_console_qualification_contract_test.py

      - name: Frozen 0E-P3 target-Pi LAN evidence
        run: PYTHONPATH=src python tests/auth_lan_console_target_pi_evidence_contract_test.py

      - name: Qualification helper surfaces
        run: |
          python tools/qualify_0e_p3_lan.py --help >/dev/null
          python tools/cleanup_0e_p3_lan.py --help >/dev/null

      - name: Credential and unsafe-bind smoke
        run: |
          PYTHONPATH=src python -m ywd1278.console.auth --help >/dev/null
          PYTHONPATH=src python -m ywd1278.console.lan_telnet --help >/dev/null
          PYTHONPATH=src python - <<'PY'
          from ywd1278.console.auth import CredentialRecord, hash_password, write_credential_file
          record = CredentialRecord('ywd', hash_password('ci-password-1278'))
          write_credential_file('/tmp/ywd1278-p3.auth', record)
          PY
          test "$(stat -c '%a' /tmp/ywd1278-p3.auth)" = "600"
          if PYTHONPATH=src python -m ywd1278.console.lan_telnet \
              --auth-file /tmp/ywd1278-p3.auth --bind 0.0.0.0 --port 8023 \
              >/tmp/p3-wildcard.out 2>&1; then
            echo 'wildcard bind unexpectedly accepted'
            exit 1
          fi
          grep -F 'restricted to loopback or RFC1918 IPv4 addresses' /tmp/p3-wildcard.out
          if PYTHONPATH=src python -m ywd1278.console.lan_telnet \
              --auth-file /tmp/ywd1278-p3.auth --bind 8.8.8.8 --port 8023 \
              >/tmp/p3-public.out 2>&1; then
            echo 'public bind unexpectedly accepted'
            exit 1
          fi
          grep -F 'restricted to loopback or RFC1918 IPv4 addresses' /tmp/p3-public.out

      - name: Preserve frozen 0E-P2 qualification
        run: |
          PYTHONPATH=src python tests/telnet_tnc_console_test.py
          PYTHONPATH=src python tests/telnet_tnc_console_contract_test.py
          PYTHONPATH=src python tests/telnet_tnc_console_qualification_contract_test.py
          PYTHONPATH=src python tests/telnet_tnc_console_target_pi_evidence_contract_test.py

      - name: Preserve frozen 0E-P1 boundary and qualification
        run: |
          PYTHONPATH=src python tests/local_tnc_console_test.py
          PYTHONPATH=src python tests/local_tnc_console_contract_test.py
          PYTHONPATH=src python tests/local_tnc_console_qualification_contract_test.py

      - name: Preserve frozen 0D-P6 target-Pi and host qualification
        run: |
          PYTHONPATH=src python tests/diagnostics_status_test.py
          PYTHONPATH=src python tests/diagnostics_status_contract_test.py
          PYTHONPATH=src python tests/diagnostics_status_qualification_contract_test.py
          PYTHONPATH=src python tests/diagnostics_status_target_pi_evidence_contract_test.py

      - name: Preserve frozen 0D-P5/P4/P3/P2/P1 qualification
        run: |
          PYTHONPATH=src python tests/retention_target_pi_evidence_contract_test.py
          PYTHONPATH=src python tests/retention_qualification_contract_test.py
          PYTHONPATH=src python tests/mheard_target_pi_evidence_contract_test.py
          PYTHONPATH=src python tests/mheard_qualification_contract_test.py
          PYTHONPATH=src python tests/sqlite_frame_log_target_pi_evidence_contract_test.py
          PYTHONPATH=src python tests/sqlite_frame_log_qualification_contract_test.py
          PYTHONPATH=src python tests/monitor_policy_qualification_contract_test.py
          PYTHONPATH=src python tests/monitor_stream_qualification_contract_test.py

      - name: Preserve frozen sustained TNC runtime boundary
        run: |
          PYTHONPATH=src python tests/live_p8_r3_physical_evidence_contract_test.py
          PYTHONPATH=src python tests/sustained_live_fifo_drain_regression_test.py
          PYTHONPATH=src python tests/sustained_kiss_tnc_integration_test.py

      - name: Parse 0E-P3 qualification evidence
        run: |
          python -m json.tool firmware/qualification/0e-p3-auth-lan-console-host.json >/dev/null
          python -m json.tool firmware/qualification/0e-p3-auth-lan-console-target-pi.json >/dev/null

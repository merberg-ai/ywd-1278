name: 0f-p9-ci

on:
  push:
    branches: [dev-0f-p9-persistent-product-converse]
  workflow_dispatch:

jobs:
  persistent-product-converse:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: "src:tools:tests"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Exact checked-out tip
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Compile P9 tree and shell syntax
        run: |
          python -m compileall -q src firmware tests tools
          bash -n installer/product-tx-control.sh
          bash -n installer/update-installed-software.sh

      - name: 0F-P9 host configuration qualification
        run: python tests/persistent_product_converse_0f_p9_test.py

      - name: 0F-P9 persistent service activation contract
        run: python tests/persistent_product_converse_0f_p9_contract_test.py

      - name: 0F-P9 software-only update contract
        run: python tests/software_update_0f_p9_contract_test.py

      - name: 0F-P9 zero-I/O control dry runs
        run: |
          bash installer/product-tx-control.sh enable --dry-run --expected-installed-commit 0000000000000000000000000000000000000000
          bash installer/product-tx-control.sh disable --dry-run
          bash installer/update-installed-software.sh --dry-run

      - name: Frozen P8 sustained converse qualification remains green
        run: |
          python tests/classic_tx_converse_0f_p8_session_test.py
          python tests/classic_tx_converse_0f_p8_physical_staging_contract_test.py
          python tools/qualify_0f_p8_sustained_converse.py
          python tests/classic_tx_converse_0f_p8_physical_evidence_contract_test.py

      - name: RX-safe product activation remains fail-closed for TX
        run: |
          python tests/product_fresh_install_appliance_qualified_contract_test.py
          grep -q 'TX must remain disabled for service activation' installer/enable-product-service.sh

      - name: Frozen product terminal regressions
        run: |
          python tests/classic_tx_converse_product_session_test.py
          python tests/telnet_tnc_console_test.py
          python tests/auth_lan_console_test.py
          python tests/pty_serial_tnc_console_test.py

      - name: Install package and framework self-test
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --disable-pip-version-check .
          .venv/bin/ywd1278d --config config/ywd-1278.example.toml --framework-self-test

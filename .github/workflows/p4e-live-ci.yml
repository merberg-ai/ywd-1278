name: p4e-live-ci

on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev-0c-p4e-live-multicycle]

jobs:
  p4e-live-staging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Compile P4e live harness and contract
        run: |
          python -m py_compile tools/qualify_live_p4e_multicycle.py
          python -m py_compile tests/live_p4e_multicycle_contract_test.py

      - name: P4e live guarded harness dry run
        run: python tools/qualify_live_p4e_multicycle.py

      - name: P4e live multi-cycle safety contract
        run: python tests/live_p4e_multicycle_contract_test.py

      - name: Parse P4e live staging manifest
        run: |
          python - <<'PY'
          import json
          data = json.load(open('firmware/qualification/0c-p4e-live-multicycle.json', encoding='utf-8'))
          assert data['phase'] == '0C-P4e-live'
          assert data['status'] == 'staged'
          assert data['base_checkpoint_sha'] == '0257f9947aea60d943b6b6b52e2ad7d9e28766de'
          assert data['frequency_hz'] == 145050000
          assert data['rf_power'] == 200
          assert data['cycles'] == 3
          assert len(data['frames']) == 3
          assert data['required_pre_tx_decoded_frames'] == 3
          assert data['required_total_inbound_decoded_frames'] == 4
          assert data['required_external_tx_decodes'] == 3
          assert data['maximum_transmit_submissions'] == 3
          assert data['automatic_tx_retry'] is False
          assert data['kiss_tx_connected'] is False
          assert data['product_tx_enabled'] is False
          assert data['flash_permitted'] is False
          assert data['gpio_reset_permitted'] is False
          assert data['option_bytes_permitted'] is False
          print('P4E_LIVE_MANIFEST_PARSE=PASS')
          PY

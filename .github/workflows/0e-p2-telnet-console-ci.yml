name: 0e-p2-telnet-console-ci

on:
  push:
    branches: [dev-0e-p2-telnet-console]
  pull_request:
    branches: [dev]
    paths:
      - 'src/ywd1278/console/telnet.py'
      - 'tests/telnet_tnc_console*_test.py'
      - '.github/workflows/0e-p2-telnet-console-ci.yml'
      - 'firmware/qualification/0e-p2-*'
      - 'docs/qualifications/0e-p2-*'
      - 'docs/ROADMAP.md'

jobs:
  telnet-console-host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Compile 0E-P2 boundary
        run: |
          python -m py_compile src/ywd1278/console/telnet.py
          python -m py_compile tests/telnet_tnc_console_test.py
          python -m py_compile tests/telnet_tnc_console_contract_test.py

      - name: Telnet TNC console regression
        run: python tests/telnet_tnc_console_test.py

      - name: Telnet TNC console architecture and safety contract
        run: python tests/telnet_tnc_console_contract_test.py

      - name: Module entry-point smoke
        run: |
          PYTHONPATH=src python -m ywd1278.console.telnet --help >/dev/null
          if PYTHONPATH=src python -m ywd1278.console.telnet --bind 0.0.0.0 --port 8023 >/tmp/p2-invalid.out 2>&1; then
            echo 'non-loopback bind unexpectedly accepted'
            exit 1
          fi
          grep -F 'restricted to IPv4 loopback addresses' /tmp/p2-invalid.out

      - name: Preserve frozen 0E-P1 boundary and qualification
        run: |
          python tests/local_tnc_console_test.py
          python tests/local_tnc_console_contract_test.py
          python tests/local_tnc_console_qualification_contract_test.py

      - name: Preserve frozen 0D-P6 target-Pi and host qualification
        run: |
          python tests/diagnostics_status_test.py
          python tests/diagnostics_status_contract_test.py
          python tests/diagnostics_status_qualification_contract_test.py
          python tests/diagnostics_status_target_pi_evidence_contract_test.py

      - name: Preserve frozen 0D-P5/P4/P3/P2/P1 qualification
        run: |
          python tests/retention_target_pi_evidence_contract_test.py
          python tests/retention_qualification_contract_test.py
          python tests/mheard_target_pi_evidence_contract_test.py
          python tests/mheard_qualification_contract_test.py
          python tests/sqlite_frame_log_target_pi_evidence_contract_test.py
          python tests/sqlite_frame_log_qualification_contract_test.py
          python tests/monitor_policy_qualification_contract_test.py
          python tests/monitor_stream_qualification_contract_test.py

      - name: Preserve frozen sustained TNC runtime boundary
        run: |
          python tests/live_p8_r3_physical_evidence_contract_test.py
          python tests/sustained_live_fifo_drain_regression_test.py
          python tests/sustained_kiss_tnc_integration_test.py

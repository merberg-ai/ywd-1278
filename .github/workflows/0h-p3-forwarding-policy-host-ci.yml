name: 0h-p3-forwarding-policy-host-ci
on:
  push: {branches: [dev-0h-p3-forwarding-policy]}
  pull_request: {branches: [checkpoint/0h-p2-mailbox-storage-host-qualified]}
  workflow_dispatch:
jobs:
  forwarding-policy:
    runs-on: ubuntu-latest
    env: {PYTHONPATH: "src:tests"}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m py_compile src/ywd1278/node/forwarding.py tests/forwarding_policy_0h_p3_test.py tests/forwarding_policy_0h_p3_contract_test.py
      - run: python tests/forwarding_policy_0h_p3_test.py && python tests/forwarding_policy_0h_p3_contract_test.py
      - run: python tests/mailbox_storage_0h_p2_test.py && python tests/mailbox_storage_0h_p2_contract_test.py && python tests/node_commands_0h_p1_test.py && python tests/node_commands_0h_p1_contract_test.py && python tests/connected_physical_0g_p6_evidence_contract_test.py

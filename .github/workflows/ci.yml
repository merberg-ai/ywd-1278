name: framework-ci

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Shell syntax
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "bash -n $file"
            bash -n "$file"
          done < <(find installer firmware tests -type f -name '*.sh' -print0)

      - name: Setup prompt regression
        run: |
          bash tests/setup_prompt_test.sh

      - name: Compile Python
        run: |
          python -m compileall -q src firmware tests tools

      - name: AX.25 codec regression
        run: |
          python tests/ax25_codec_test.py

      - name: Bell-202 TX serialization regression
        run: |
          python tests/bell202_tx_test.py

      - name: Bell-202 streaming RX regression
        run: |
          python tests/bell202_rx_test.py

      - name: Modem protocol regression
        run: |
          python tests/modem_protocol_test.py

      - name: RX-only modem setup regression
        run: |
          python tests/rx_config_test.py

      - name: Single-owner modem regression
        run: |
          python tests/modem_owner_test.py

      - name: Fixed TX qualification profile regression
        run: |
          python tests/tx_qualification_profile_test.py

      - name: Bounded TX broker regression
        run: |
          python tests/tx_broker_test.py

      - name: Bounded TX broker architecture contract
        run: |
          python tests/tx_broker_contract_test.py

      - name: Deterministic CSMA policy regression
        run: |
          python tests/csma_policy_test.py

      - name: Deterministic CSMA architecture contract
        run: |
          python tests/csma_policy_contract_test.py

      - name: RSSI telemetry host regression
        run: |
          python tests/rssi_telemetry_test.py

      - name: AX25R4 RSSI firmware build contract
        run: |
          python tests/rssi_firmware_build_contract_test.py

      - name: P2 locked artifact/live RSSI activation contract
        run: |
          python tests/rssi_live_activation_contract_test.py

      - name: P2 R2 clean readback stdout contract
        run: |
          python tests/rssi_readback_stdout_contract_test.py

      - name: RSSI cluster analysis regression
        run: |
          python tests/rssi_analysis_test.py

      - name: P2 packet-correlated RSSI contract
        run: |
          python tests/rssi_packet_correlation_contract_test.py

      - name: P2 deterministic channel-busy detector regression
        run: |
          python tests/channel_busy_test.py

      - name: P2 channel-busy architecture contract
        run: |
          python tests/channel_busy_contract_test.py

      - name: P3 detector to CSMA integration regression
        run: |
          python tests/channel_access_integration_test.py

      - name: P3 live channel-access sampler regression
        run: |
          python tests/live_channel_access_sampler_test.py

      - name: P3 shadow channel-access architecture contract
        run: |
          python tests/channel_access_live_contract_test.py

      - name: P3 live physical staging contract
        run: |
          python tests/live_shadow_channel_access_contract_test.py

      - name: P4a bounded access queue regression
        run: |
          python tests/access_queue_test.py

      - name: P4a bounded access queue architecture contract
        run: |
          python tests/access_queue_contract_test.py

      - name: P4a staging manifest contract
        run: |
          python tests/access_queue_manifest_test.py

      - name: P4b real broker fake modem integration
        run: |
          python tests/access_queue_broker_integration_test.py

      - name: P4b real broker fake modem architecture contract
        run: |
          python tests/access_queue_broker_contract_test.py

      - name: P4c real owner fake transport integration
        run: |
          python tests/access_queue_tx_owner_integration_test.py

      - name: P4c real owner fake transport architecture contract
        run: |
          python tests/access_queue_tx_owner_contract_test.py

      - name: P4e persistent half-duplex failure semantics
        run: |
          python tests/half_duplex_test.py

      - name: P4e repeated real graph over fake transport
        run: |
          python tests/half_duplex_tx_owner_integration_test.py

      - name: P4e persistent half-duplex architecture contract
        run: |
          python tests/half_duplex_contract_test.py

      - name: P5 TXDELAY policy and broker regression
        run: |
          python tests/txdelay_test.py

      - name: P5 TXDELAY architecture contract
        run: |
          python tests/txdelay_contract_test.py

      - name: P6 KISS control-plane policy regression
        run: |
          python tests/kiss_control_plane_test.py

      - name: P6 KISS control-plane TCP regression
        run: |
          python tests/kiss_control_plane_server_test.py

      - name: P6 KISS control-plane architecture contract
        run: |
          python tests/kiss_control_plane_contract_test.py

      - name: P7 bounded KISS DATA admission regression
        run: |
          python tests/kiss_data_admission_test.py

      - name: P7 localhost KISS full fake-hardware graph
        run: |
          python tests/kiss_data_full_graph_integration_test.py

      - name: P7 KISS DATA architecture contract
        run: |
          python tests/kiss_data_admission_contract_test.py

      - name: P13b one-shot TX qualification contract
        run: |
          python tests/single_tx_qualification_contract_test.py

      - name: P13b-R1 three-packet verification contract
        run: |
          python tests/three_tx_qualification_contract_test.py

      - name: P13b-R2 corrected three-packet verification contract
        run: |
          python tests/three_tx_r2_qualification_contract_test.py

      - name: POSIX modem transport regression
        run: |
          python tests/modem_serial_transport_test.py

      - name: KISS framing regression
        run: |
          python tests/kiss_framing_test.py

      - name: RX-only TCP KISS server regression
        run: |
          python tests/kiss_server_test.py

      - name: Assembled RX product runtime regression
        run: |
          python tests/rx_product_runtime_test.py

      - name: Firmware identity classification
        run: |
          python tests/firmware_identity_test.py

      - name: Firmware build contract
        run: |
          python tests/firmware_build_contract_test.py

      - name: Packet firmware build contract
        run: |
          python tests/packet_firmware_build_contract_test.py

      - name: Vendored engineering blob contract
        run: |
          python tests/vendored_engineering_contract_test.py

      - name: Frozen engineering compatibility wrapper contract
        run: |
          python tests/packet_engineering_fetch_contract_test.py

      - name: Firmware backup contract
        run: |
          python tests/firmware_backup_contract_test.py

      - name: Firmware roundtrip contract
        run: |
          python tests/firmware_roundtrip_contract_test.py

      - name: Packet firmware roundtrip contract
        run: |
          python tests/packet_firmware_roundtrip_contract_test.py

      - name: Packet live-RX activation contract
        run: |
          python tests/packet_live_rx_activation_contract_test.py

      - name: Live RF to TCP KISS qualification contract
        run: |
          python tests/live_rx_kiss_contract_test.py

      - name: Parse manifests and config
        run: |
          python - <<'PY'
          import json, tomllib
          json.load(open('firmware/targets.json', encoding='utf-8'))
          json.load(open('firmware/tooling/build-manifest.json', encoding='utf-8'))
          json.load(open('firmware/tooling/packet-build-manifest.json', encoding='utf-8'))
          json.load(open('firmware/tooling/packet-rssi-build-manifest.json', encoding='utf-8'))
          json.load(open('firmware/qualification/p13b-single-tx.json', encoding='utf-8'))
          json.load(open('firmware/qualification/p13b-r1-three-tx.json', encoding='utf-8'))
          json.load(open('firmware/qualification/p13b-r2-three-tx.json', encoding='utf-8'))
          json.load(open('firmware/qualification/0c-p2-rssi-live-stage.json', encoding='utf-8'))
          json.load(open('firmware/qualification/0c-p2-rssi-live-physical-evidence.json', encoding='utf-8'))
          json.load(open('firmware/qualification/0c-p2-rssi-packet-correlation-physical-evidence.json', encoding='utf-8'))
          json.load(open('firmware/qualification/0c-p3-live-shadow-channel-access.json', encoding='utf-8'))
          json.load(open('firmware/qualification/0c-p3-live-shadow-channel-access-physical-evidence.json', encoding='utf-8'))
          json.load(open('firmware/qualification/0c-p4a-bounded-access-queue.json', encoding='utf-8'))
          json.load(open('firmware/qualification/0c-p4b-real-broker-fake-modem.json', encoding='utf-8'))
          json.load(open('firmware/qualification/0c-p4c-real-owner-fake-transport.json', encoding='utf-8'))
          p4e = json.load(open('firmware/qualification/0c-p4e-persistent-half-duplex-host.json', encoding='utf-8'))
          assert p4e['status'] == 'host-qualified'
          p5 = json.load(open('firmware/qualification/0c-p5-txdelay-host.json', encoding='utf-8'))
          assert p5['status'] == 'host-qualified'
          p6 = json.load(open('firmware/qualification/0c-p6-kiss-control-plane.json', encoding='utf-8'))
          assert p6['status'] == 'host-qualified'
          assert p6['safety']['kiss_data_tx_connected'] is False
          p7 = json.load(open('firmware/qualification/0c-p7-kiss-data-admission.json', encoding='utf-8'))
          assert p7['status'] == 'host-qualified'
          assert p7['safety']['host_fake_modem_only'] is True
          assert p7['safety']['rf_transmitted'] is False
          assert p7['physical_follow_on']['authorized'] is False
          with open('config/ywd-1278.example.toml', 'rb') as f:
              tomllib.load(f)
          print('MANIFEST_CONFIG_PARSE=PASS')
          PY

      - name: Install package
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --disable-pip-version-check .
          .venv/bin/ywd1278 --version

      - name: Framework self-test
        run: |
          .venv/bin/ywd1278d --config config/ywd-1278.example.toml --framework-self-test

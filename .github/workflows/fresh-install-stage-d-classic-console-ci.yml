name: fresh-install-stage-d-classic-console-ci

on:
  push:
    branches: [dev-fresh-install-stage-d-console]
  pull_request:
    branches: [dev]
    paths:
      - 'src/ywd1278/service/classic_console.py'
      - 'src/ywd1278/daemon.py'
      - 'config/ywd-1278.example.toml'
      - 'tests/product_classic_console_stage_d_test.py'
      - 'tests/product_full_daemon_stage_d_test.py'
      - 'tests/product_classic_console_stage_d_contract_test.py'
      - 'firmware/qualification/0b-product-classic-console-stage-d.json'
      - 'docs/qualifications/fresh-install-stage-d-classic-console-host-qualified-2026-09-04.md'
      - '.github/workflows/fresh-install-stage-d-classic-console-ci.yml'

jobs:
  product-classic-console-stage-d:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src:tests
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Compile Stage D classic console boundary
        run: |
          python -m py_compile src/ywd1278/service/classic_console.py
          python -m py_compile src/ywd1278/daemon.py
          python -m py_compile tests/product_classic_console_stage_d_test.py
          python -m py_compile tests/product_full_daemon_stage_d_test.py
          python -m py_compile tests/product_classic_console_stage_d_contract_test.py

      - name: Stage D real socket and kernel PTY integration regression
        run: python tests/product_classic_console_stage_d_test.py

      - name: Stage D simultaneous full daemon graph regression
        run: python tests/product_full_daemon_stage_d_test.py

      - name: Stage D architecture and safety contract
        run: python tests/product_classic_console_stage_d_contract_test.py

      - name: Preserve Stage C product observability behavior
        run: python tests/product_observability_stage_c_test.py

      - name: Preserve Stage A exact packet-engine freeze
        run: python tests/product_packet_engine_stage_a_contract_test.py

      - name: Replay frozen 0E-P5 classic vocabulary and evidence
        run: |
          python tests/classic_tnc_vocabulary_test.py
          python tests/classic_tnc_vocabulary_contract_test.py
          python tests/classic_tnc_vocabulary_qualification_contract_test.py
          python tests/classic_tnc_vocabulary_target_pi_evidence_contract_test.py

      - name: Preserve frozen P3/P4 transport evidence
        run: |
          python tests/auth_lan_console_contract_test.py
          python tests/pty_serial_tnc_console_contract_test.py
          python tests/pty_serial_tnc_console_target_pi_evidence_contract_test.py

      - name: Preserve frozen 0D logging MHEARD diagnostics boundaries
        run: |
          python tests/sqlite_frame_log_qualification_contract_test.py
          python tests/mheard_qualification_contract_test.py
          python tests/diagnostics_status_qualification_contract_test.py
          python tests/retention_qualification_contract_test.py

      - name: Preserve sustained TNC and physical evidence contracts
        run: |
          python tests/sustained_kiss_tnc_integration_test.py
          python tests/live_p7_kiss_one_shot_evidence_contract_test.py
          python tests/live_p8_r3_physical_evidence_contract_test.py

      - name: Preserve zero-I/O daemon framework self-test
        run: |
          tmp="$(mktemp)"
          python -m ywd1278.daemon --config "$tmp" --framework-self-test | tee /tmp/ywd-stage-d-self-test.txt
          grep -q '^YWD1278_FRAMEWORK_SELF_TEST=PASS$' /tmp/ywd-stage-d-self-test.txt
          grep -q '^MODEM_UART_OPENED=NO$' /tmp/ywd-stage-d-self-test.txt
          grep -q '^RF_TRANSMITTED=NO$' /tmp/ywd-stage-d-self-test.txt

      - name: Parse Stage D qualification manifest
        run: |
          python -m json.tool firmware/qualification/0b-product-classic-console-stage-d.json >/dev/null
          python - <<'PY'
          import json
          p = 'firmware/qualification/0b-product-classic-console-stage-d.json'
          d = json.load(open(p, encoding='utf-8'))
          assert d['phase'] == 'fresh-install-stage-d-product-classic-console'
          assert d['status'] == 'host-qualified'
          assert d['base_checkpoint']['sha'] == '6651480fb7c4872fa2349ef0ad82f9d9920b7253'
          assert d['cleanup']['accidental_hidden_marker_files_removed_on_stage_d_branch'] is True
          assert d['cleanup']['removed_marker_count'] == 7
          assert d['frozen_stage_c']['modified'] is False
          assert d['frozen_0e']['modified'] is False
          assert d['host_qualification']['ci_run_id'] == 33873695993
          assert d['host_qualification']['ci_conclusion'] == 'success'
          assert d['host_qualification']['same_rx_visible_to_kiss_and_classic_console'] == 'pass'
          assert d['host_qualification']['full_daemon_graph_host_qualified'] is True
          assert d['host_qualification']['fake_transport_tx_accept_count'] == 0
          assert d['host_qualification']['real_rfc1918_listener_bind_exercised'] is False
          assert d['product_policy']['rfc1918_requires_auth_file'] is True
          assert d['product_policy']['console_tx_authority'] is False
          assert d['hardware_activity'] == {
              'uart': False,
              'rf': False,
              'flash': False,
              'gpio': False,
              'option_bytes': False,
          }
          print('STAGE_D_MANIFEST_PARSE=PASS')
          PY

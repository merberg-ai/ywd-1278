name: 0d-p3-sqlite-log-ci

on:
  push:
    branches: [dev-0d-p3-sqlite-frame-log, dev]
  pull_request:
    branches: [dev]

jobs:
  sqlite-frame-log-host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Compile 0D-P3 boundary
        run: |
          python -m py_compile src/ywd1278/monitor/sqlite_log.py
          python -m py_compile tests/sqlite_frame_log_test.py
          python -m py_compile tests/sqlite_frame_log_contract_test.py

      - name: SQLite frame-log regression
        run: python tests/sqlite_frame_log_test.py

      - name: SQLite frame-log architecture and safety contract
        run: python tests/sqlite_frame_log_contract_test.py

      - name: Preserve frozen 0D-P1/P2 qualification
        run: |
          python tests/monitor_stream_test.py
          python tests/monitor_stream_contract_test.py
          python tests/monitor_stream_qualification_contract_test.py
          python tests/monitor_policy_test.py
          python tests/monitor_policy_contract_test.py
          python tests/monitor_policy_qualification_contract_test.py

      - name: Preserve frozen P8 physical qualification and sustained graph
        run: |
          python tests/live_p8_r3_physical_evidence_contract_test.py
          python tests/live_p8_r3_sustained_kiss_tnc_contract_test.py
          python tests/sustained_live_fifo_drain_regression_test.py
          python tests/sustained_kiss_tnc_integration_test.py

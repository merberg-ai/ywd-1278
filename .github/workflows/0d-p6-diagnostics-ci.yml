name: 0d-p6-diagnostics-ci

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

jobs:
  diagnostics-host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Compile 0D-P6 boundary
        run: |
          python -m py_compile src/ywd1278/monitor/diagnostics.py
          python -m py_compile tests/diagnostics_status_test.py
          python -m py_compile tests/diagnostics_status_contract_test.py
          python -m py_compile tests/diagnostics_status_qualification_contract_test.py
          python -m py_compile tests/diagnostics_status_target_pi_evidence_contract_test.py
          python -m py_compile tests/retention_target_pi_evidence_contract_test.py

      - name: Diagnostics/status regression
        run: python tests/diagnostics_status_test.py

      - name: Diagnostics architecture and safety contract
        run: python tests/diagnostics_status_contract_test.py

      - name: Frozen 0D-P6 host qualification evidence
        run: python tests/diagnostics_status_qualification_contract_test.py

      - name: Frozen 0D-P6 target-Pi sanity evidence
        run: python tests/diagnostics_status_target_pi_evidence_contract_test.py

      - name: Preserve P5 target-Pi evidence
        run: python tests/retention_target_pi_evidence_contract_test.py

      - name: Preserve frozen P5 retention qualification
        run: |
          python tests/retention_test.py
          python tests/retention_contract_test.py
          python tests/retention_qualification_contract_test.py

      - name: Preserve frozen P4/P3 monitor database qualification
        run: |
          python tests/mheard_target_pi_evidence_contract_test.py
          python tests/mheard_qualification_contract_test.py
          python tests/sqlite_frame_log_target_pi_evidence_contract_test.py
          python tests/sqlite_frame_log_qualification_contract_test.py
          python tests/monitor_policy_qualification_contract_test.py
          python tests/monitor_stream_qualification_contract_test.py

      - name: Preserve frozen sustained TNC graph and P8 physical qualification
        run: |
          python tests/live_p8_r3_physical_evidence_contract_test.py
          python tests/live_p8_r3_sustained_kiss_tnc_contract_test.py
          python tests/sustained_live_fifo_drain_regression_test.py
          python tests/sustained_kiss_tnc_integration_test.py

      - name: Parse P6 qualification evidence
        run: |
          python -m json.tool firmware/qualification/0d-p6-diagnostics-status-host.json >/dev/null
          python -m json.tool firmware/qualification/0d-p6-diagnostics-status-target-pi-sanity-2026-09-03.json >/dev/null

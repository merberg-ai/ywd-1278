name: 0e-p4-virtual-pty-console-ci

on:
  push:
    branches: [dev-0e-p4-virtual-pty-console]
  pull_request:
    branches: [dev]
    paths:
      - 'src/ywd1278/console/pty_serial.py'
      - 'tests/pty_serial_tnc_console*_test.py'
      - 'tools/qualify_0e_p4_pty.py'
      - '.github/workflows/0e-p4-virtual-pty-console-ci.yml'
      - 'firmware/qualification/0e-p4-*'
      - 'docs/qualifications/0e-p4-*'
      - 'docs/ROADMAP.md'

jobs:
  virtual-pty-console-host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile 0E-P4 boundary
        run: |
          python -m py_compile src/ywd1278/console/pty_serial.py
          python -m py_compile tests/pty_serial_tnc_console_test.py
          python -m py_compile tests/pty_serial_tnc_console_contract_test.py
          python -m py_compile tests/pty_serial_tnc_console_qualification_contract_test.py
          python -m py_compile tests/pty_serial_tnc_console_target_pi_evidence_contract_test.py
          python -m py_compile tools/qualify_0e_p4_pty.py
      - name: Virtual PTY console regression
        run: PYTHONPATH=src python tests/pty_serial_tnc_console_test.py
      - name: Virtual PTY console architecture and safety contract
        run: PYTHONPATH=src python tests/pty_serial_tnc_console_contract_test.py
      - name: PTY CLI and deterministic qualification helper smoke
        run: |
          PYTHONPATH=src python -m ywd1278.console.pty_serial --help >/dev/null
          PYTHONPATH=src python tools/qualify_0e_p4_pty.py
      - name: SIGTERM stable-link lifecycle smoke
        run: |
          set -euo pipefail
          LINK=/tmp/ywd1278-p4-ci-tnc
          LOG=/tmp/ywd1278-p4-ci.log
          test ! -e "$LINK"
          test ! -L "$LINK"
          PYTHONPATH=src python -u -m ywd1278.console.pty_serial --link "$LINK" >"$LOG" 2>&1 &
          PID=$!
          cleanup() {
            if kill -0 "$PID" 2>/dev/null; then
              kill -TERM "$PID" 2>/dev/null || true
              wait "$PID" 2>/dev/null || true
            fi
            rm -f "$LINK" "$LOG"
          }
          trap cleanup EXIT
          for _ in $(seq 1 100); do test -L "$LINK" && break; sleep 0.05; done
          test -L "$LINK"
          TARGET=$(readlink "$LINK")
          case "$TARGET" in /dev/pts/*) ;; *) echo "unexpected PTY target: $TARGET"; exit 1 ;; esac
          test "$(stat -Lc '%a' "$LINK")" = "600"
          stty -F "$LINK" -a >/dev/null
          kill -TERM "$PID"
          wait "$PID"
          test ! -e "$LINK"
          test ! -L "$LINK"
          grep -F 'YWD1278_0E_P4_SLAVE_PTY=/dev/pts/' "$LOG"
          grep -F "YWD1278_0E_P4_STABLE_LINK=$LINK" "$LOG"
          echo 'SIGTERM_STABLE_LINK_CLEANUP=PASS'
          trap - EXIT
          rm -f "$LOG"
      - name: Frozen 0E-P4 host qualification evidence
        run: PYTHONPATH=src python tests/pty_serial_tnc_console_qualification_contract_test.py
      - name: Frozen 0E-P4 target-Pi qualification evidence
        run: PYTHONPATH=src python tests/pty_serial_tnc_console_target_pi_evidence_contract_test.py
      - name: Preserve frozen 0E-P3 qualification
        run: |
          PYTHONPATH=src python tests/auth_lan_console_test.py
          PYTHONPATH=src python tests/auth_lan_console_contract_test.py
          PYTHONPATH=src python tests/auth_lan_console_qualification_contract_test.py
          PYTHONPATH=src python tests/auth_lan_console_target_pi_evidence_contract_test.py
      - name: Preserve frozen 0E-P2 qualification
        run: |
          PYTHONPATH=src python tests/telnet_tnc_console_test.py
          PYTHONPATH=src python tests/telnet_tnc_console_contract_test.py
          PYTHONPATH=src python tests/telnet_tnc_console_qualification_contract_test.py
          PYTHONPATH=src python tests/telnet_tnc_console_target_pi_evidence_contract_test.py
      - name: Preserve frozen 0E-P1 boundary and qualification
        run: |
          PYTHONPATH=src python tests/local_tnc_console_test.py
          PYTHONPATH=src python tests/local_tnc_console_contract_test.py
          PYTHONPATH=src python tests/local_tnc_console_qualification_contract_test.py
      - name: Preserve frozen 0D-P6 target-Pi and host qualification
        run: |
          PYTHONPATH=src python tests/diagnostics_status_test.py
          PYTHONPATH=src python tests/diagnostics_status_contract_test.py
          PYTHONPATH=src python tests/diagnostics_status_qualification_contract_test.py
          PYTHONPATH=src python tests/diagnostics_status_target_pi_evidence_contract_test.py
      - name: Preserve frozen 0D-P5/P4/P3/P2/P1 qualification
        run: |
          PYTHONPATH=src python tests/retention_target_pi_evidence_contract_test.py
          PYTHONPATH=src python tests/retention_qualification_contract_test.py
          PYTHONPATH=src python tests/mheard_target_pi_evidence_contract_test.py
          PYTHONPATH=src python tests/mheard_qualification_contract_test.py
          PYTHONPATH=src python tests/sqlite_frame_log_target_pi_evidence_contract_test.py
          PYTHONPATH=src python tests/sqlite_frame_log_qualification_contract_test.py
          PYTHONPATH=src python tests/monitor_policy_qualification_contract_test.py
          PYTHONPATH=src python tests/monitor_stream_qualification_contract_test.py
      - name: Preserve frozen sustained TNC runtime boundary
        run: |
          PYTHONPATH=src python tests/live_p8_r3_physical_evidence_contract_test.py
          PYTHONPATH=src python tests/sustained_live_fifo_drain_regression_test.py
          PYTHONPATH=src python tests/sustained_kiss_tnc_integration_test.py
      - name: Parse 0E-P4 qualification evidence
        run: |
          python -m json.tool firmware/qualification/0e-p4-virtual-pty-console-host.json >/dev/null
          python -m json.tool firmware/qualification/0e-p4-virtual-pty-console-target-pi.json >/dev/null

name: 0d-p5-retention-ci

on:
  push:
    branches: [dev-0d-p5-retention, dev]
  pull_request:
    branches: [dev]

jobs:
  retention-host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Compile 0D-P5 boundary
        run: |
          python -m py_compile src/ywd1278/monitor/retention.py
          python -m py_compile tests/retention_test.py
          python -m py_compile tests/retention_contract_test.py
          python -m py_compile tests/mheard_target_pi_evidence_contract_test.py

      - name: Retention regression
        run: python tests/retention_test.py

      - name: Retention architecture and safety contract
        run: python tests/retention_contract_test.py

      - name: Preserve P4 target-Pi evidence
        run: python tests/mheard_target_pi_evidence_contract_test.py

      - name: Preserve frozen P4 MHEARD qualification
        run: |
          python tests/mheard_test.py
          python tests/mheard_contract_test.py
          python tests/mheard_qualification_contract_test.py

      - name: Preserve frozen P3 SQLite qualification
        run: |
          python tests/sqlite_frame_log_target_pi_evidence_contract_test.py
          python tests/sqlite_frame_log_test.py
          python tests/sqlite_frame_log_contract_test.py
          python tests/sqlite_frame_log_qualification_contract_test.py

      - name: Preserve frozen P1/P2 monitor qualification
        run: |
          python tests/monitor_stream_qualification_contract_test.py
          python tests/monitor_policy_qualification_contract_test.py

      - name: Preserve frozen P8 physical qualification and sustained graph
        run: |
          python tests/live_p8_r3_physical_evidence_contract_test.py
          python tests/live_p8_r3_sustained_kiss_tnc_contract_test.py
          python tests/sustained_live_fifo_drain_regression_test.py
          python tests/sustained_kiss_tnc_integration_test.py

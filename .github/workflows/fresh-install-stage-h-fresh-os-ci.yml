name: fresh-install-stage-h-fresh-os-ci

on:
  push:
    branches: [dev-fresh-install-stage-h-fresh-os]
  pull_request:
    branches: [dev]
    paths:
      - 'installer/install.sh'
      - 'installer/firmware-toolchain-check.sh'
      - 'tools/stage_h_fresh_os_preflight.sh'
      - 'tests/fresh_os_stage_h_contract_test.py'
      - 'tests/fresh_os_stage_h_preinstall_evidence_contract_test.py'
      - 'tests/fresh_os_stage_h_resume_evidence_contract_test.py'
      - 'tests/fresh_os_stage_h_firmware_build_failure_evidence_contract_test.py'
      - 'firmware/qualification/0b-product-fresh-os-stage-h.json'
      - 'firmware/qualification/0b-product-fresh-os-stage-h-preinstall-target-pi.json'
      - 'firmware/qualification/0b-product-fresh-os-stage-h-resume-target-pi.json'
      - 'firmware/qualification/0b-product-fresh-os-stage-h-firmware-build-failure-target-pi.json'
      - 'docs/qualifications/fresh-install-stage-h-fresh-os-staged-2026-09-04.md'
      - '.github/workflows/fresh-install-stage-h-fresh-os-ci.yml'

jobs:
  fresh-os-stage-h:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src:tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Parse Stage H shell surfaces
        run: |
          bash -n tools/stage_h_fresh_os_preflight.sh
          bash -n installer/install.sh
          bash -n installer/firmware-toolchain-check.sh
      - name: Stage H architecture and safety contract
        run: python tests/fresh_os_stage_h_contract_test.py
      - name: Stage H target-Pi preinstall evidence contract
        run: python tests/fresh_os_stage_h_preinstall_evidence_contract_test.py
      - name: Stage H installer resume target-Pi evidence contract
        run: python tests/fresh_os_stage_h_resume_evidence_contract_test.py
      - name: Stage H firmware-build failure evidence contract
        run: python tests/fresh_os_stage_h_firmware_build_failure_evidence_contract_test.py
      - name: Preserve Stage G final reboot evidence
        run: python tests/existing_pi_stage_g_reboot_evidence_contract_test.py
      - name: Preserve Stage G target RX evidence
        run: python tests/existing_pi_stage_g_target_evidence_contract_test.py
      - name: Preserve Stage F firmware trust
        run: |
          python tests/firmware_trust_stage_f_test.py
          python tests/firmware_trust_stage_f_contract_test.py
          python tests/firmware_trust_stage_f_qualification_contract_test.py
      - name: Preserve Stage E installer runtime
        run: |
          python tests/installer_runtime_stage_e_test.py
          python tests/installer_runtime_stage_e_contract_test.py
      - name: Replay Stage D full daemon graph
        run: |
          python tests/product_full_daemon_stage_d_test.py
          python tests/product_classic_console_stage_d_contract_test.py
      - name: Preserve Stage A packet-engine freeze
        run: python tests/product_packet_engine_stage_a_contract_test.py
      - name: Preserve sustained TNC physical evidence
        run: |
          python tests/sustained_kiss_tnc_integration_test.py
          python tests/live_p7_kiss_one_shot_evidence_contract_test.py
          python tests/live_p8_r3_physical_evidence_contract_test.py
      - name: Parse Stage H staging manifest
        run: |
          python - <<'PY'
          import json
          d=json.load(open('firmware/qualification/0b-product-fresh-os-stage-h.json',encoding='utf-8'))
          assert d['schema']==1 and d['stage']=='H'
          assert d['status']=='host-staged-physical-fresh-os-pending'
          assert d['physical_tx_permitted'] is False
          print('STAGE_H_STAGING_MANIFEST=PASS')
          PY
      - name: Parse Stage H target-Pi preinstall evidence
        run: |
          python - <<'PY'
          import json
          d=json.load(open('firmware/qualification/0b-product-fresh-os-stage-h-preinstall-target-pi.json',encoding='utf-8'))
          assert d['schema']==1 and d['stage']=='H'
          assert d['status']=='target-pi-preinstall-qualified-installer-pending'
          assert d['uart_audit']['reboot_required'] is True
          assert d['qualified_claims']['installer_uart_repair_path_required'] is True
          assert d['qualified_claims']['physical_tx'] is False
          print('STAGE_H_TARGET_PI_PREINSTALL_MANIFEST=PASS')
          PY
      - name: Parse Stage H installer resume target-Pi evidence
        run: |
          python - <<'PY'
          import json
          d=json.load(open('firmware/qualification/0b-product-fresh-os-stage-h-resume-target-pi.json',encoding='utf-8'))
          assert d['schema']==1 and d['stage']=='H'
          assert d['status']=='target-pi-installer-resume-qualified'
          assert d['post_reboot']['boot_id_changed_from_preinstall'] is True
          assert d['post_reboot']['runtime_uart_ready'] is True
          assert d['post_reboot']['serial_console_present'] is False
          assert d['hat_detection']['firmware_class']=='STOCK'
          assert d['qualified_claims']['packet_service_remained_disabled'] is True
          assert d['qualified_claims']['physical_tx'] is False
          assert d['qualified_claims']['flash_write'] is False
          print('STAGE_H_INSTALLER_RESUME_TARGET_PI_MANIFEST=PASS')
          PY
      - name: Parse Stage H failed firmware-build evidence
        run: |
          python - <<'PY'
          import json
          d=json.load(open('firmware/qualification/0b-product-fresh-os-stage-h-firmware-build-failure-target-pi.json',encoding='utf-8'))
          assert d['schema']==1 and d['stage']=='H'
          assert d['status']=='target-pi-firmware-build-blocked-toolchain-headers-missing'
          assert d['build_attempt']['artifact_produced'] is False
          assert d['safety']['flash_written'] is False
          assert d['safety']['rf_transmitted'] is False
          print('STAGE_H_FIRMWARE_BUILD_FAILURE_TARGET_PI_MANIFEST=PASS')
          PY

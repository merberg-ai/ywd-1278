name: 0d-p2-monitor-controls-ci

on:
  push:
    branches: [dev-0d-p2-monitor-controls, dev]
  pull_request:
    branches: [dev]

jobs:
  monitor-policy-host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Compile 0D-P2 boundary
        run: |
          python -m py_compile src/ywd1278/monitor/policy.py
          python -m py_compile tests/monitor_policy_test.py
          python -m py_compile tests/monitor_policy_contract_test.py
          python -m py_compile tests/monitor_policy_qualification_contract_test.py

      - name: MCOM MCON MRPT policy regression
        run: python tests/monitor_policy_test.py

      - name: Monitor policy architecture and safety contract
        run: python tests/monitor_policy_contract_test.py

      - name: Frozen 0D-P2 host qualification evidence
        run: python tests/monitor_policy_qualification_contract_test.py

      - name: Preserve frozen 0D-P1 qualification
        run: |
          python tests/monitor_stream_test.py
          python tests/monitor_stream_contract_test.py
          python tests/monitor_stream_qualification_contract_test.py

      - name: Preserve frozen P8 physical qualification and sustained graph
        run: |
          python tests/live_p8_r3_physical_evidence_contract_test.py
          python tests/live_p8_r3_sustained_kiss_tnc_contract_test.py
          python tests/sustained_live_fifo_drain_regression_test.py
          python tests/sustained_kiss_tnc_integration_test.py

      - name: Parse P2 host evidence
        run: |
          python - <<'PY'
          import json
          d=json.load(open('firmware/qualification/0d-p2-monitor-controls-host.json', encoding='utf-8'))
          assert d['status'] == 'host-qualified'
          assert d['qualification_complete'] is True
          assert d['defaults'] == {'mcom': False, 'mcon': False, 'mrpt': True}
          assert d['monitor_tx_capability'] is False
          assert d['uart_access'] is False
          assert d['rf_access'] is False
          print('0D_P2_HOST_MANIFEST_PARSE=PASS')
          PY
